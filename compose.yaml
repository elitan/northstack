# Local development database. `just dev` starts it when DATABASE_URL in .env
# is not reachable. Data persists in the `pgdata` volume; `just db-reset`
# starts over, `docker compose down -v` removes it entirely.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
