[package]
name = "server"
version = "0.1.0"
edition = "2024"
publish = false

# The binary is the whole app: HTTP, jobs, cron, migrations.
[[bin]]
name = "app"
path = "src/main.rs"

[dependencies]
northstack.workspace = true
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `sqlx-toml`: the macros read server/sqlx.toml (column types, generated by `just check`).
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "chrono", "uuid", "json", "migrate", "macros", "sqlx-toml"] }
ts-rs = { version = "12", features = ["chrono-impl", "uuid-impl", "serde-json-impl"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }
rust-embed = "8"
tracing = "0.1"

[dev-dependencies]
