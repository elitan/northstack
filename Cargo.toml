[workspace]
resolver = "2"
members = ["crates/northstack", "server", "cli"]

[workspace.dependencies]
# The framework. Apps pin an exact version here; `just upgrade` changes it.
northstack = { path = "crates/northstack" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"

# Faster dev builds: optimize dependencies, keep our code quick to compile.
[profile.dev.package."*"]
opt-level = 1
