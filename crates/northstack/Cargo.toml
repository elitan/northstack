[package]
name = "northstack"
version = "0.2.1"
license = "MIT"
edition = "2024"
rust-version = "1.88"
description = "Full-stack framework: Rust, React and SQLite in one binary, typed from the database to the UI."
repository = "https://github.com/elitan/northstack"
readme = "README.md"
keywords = ["web", "framework", "fullstack", "react", "sqlite"]
categories = ["web-programming", "web-programming::http-server", "command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
cron = "0.17.0"
mime_guess = "2.0.5"
rayon = "1.12.0"
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "chrono", "uuid", "json", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "request-id", "timeout", "compression-gzip", "util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
ts-rs = { version = "12", features = ["chrono-impl", "uuid-impl", "serde-json-impl"] }
uuid = { version = "1.29.1", features = ["serde", "v4", "v7"] }
