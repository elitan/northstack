[package]
name = "northstack"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
cron = "0.17.0"
futures = "0.3.34"
mime_guess = "2.0.5"
rayon = "1.12.0"
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "chrono", "uuid", "json", "migrate", "macros", "tls-rustls-ring-webpki", "bigdecimal"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "request-id", "timeout", "compression-gzip", "util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
ts-rs = { version = "12", features = ["chrono-impl", "uuid-impl", "serde-json-impl", "bigdecimal-impl"] }
uuid = { version = "1.29.1", features = ["serde", "v4"] }
